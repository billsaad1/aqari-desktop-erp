name: Flutter CI

on:
  pull_request:
    branches:
      - task-1-init-erp-10867797379436202743
  push:
    branches:
      - task-1-init-erp-10867797379436202743
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter sources
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run complete test suite
        run: flutter test --no-pub --reporter=expanded
