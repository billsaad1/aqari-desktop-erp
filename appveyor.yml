version: 1.0.{build}

image: Visual Studio 2022

environment:
  FLUTTER_CHANNEL: stable

install:
  - git clone https://github.com/flutter/flutter.git --depth 1 -b %FLUTTER_CHANNEL% C:\flutter
  - set PATH=C:\flutter\bin;%PATH%
  - flutter config --enable-windows-desktop
  - flutter doctor
  - flutter pub get

build_script:
  - flutter build windows

artifacts:
  - path: build\windows\x64\runner\Release
    name: DesktopERP
